      The isuZu wordmark's face (Bodoni Moda, see src/assets/css/fonts.css), so

    -->

      rel="preload"
      href="/node_modules/@fontsource-variable/bodoni-moda/files/bodoni-moda-latin-opsz-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
